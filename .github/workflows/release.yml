name: release

# Builds a release of the (private) app code and publishes it here, where the
# app looks for updates. Run it from the Actions tab on the default branch with
# the exact semantic version number (MAJOR.MINOR.PATCH, matching
# native/player/Cargo.toml and tag v<version> in GonzaloH12/HaxballAPP).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact semantic version to release, e.g. 0.1.2 (tag v0.1.2 in GonzaloH12/HaxballAPP)"
        required: true
        type: string

# Default to minimal read-only permissions; only the isolated signing/publishing job gets contents: write.
permissions:
  contents: read

env:
  ESBUILD_VERSION: "0.25.0"

jobs:
  build:
    name: Build and verify unsigned artifacts
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      source_commit: ${{ steps.verify_source.outputs.source_commit }}
      zip_sha256: ${{ steps.verify_artifacts.outputs.zip_sha256 }}
      installer_sha256: ${{ steps.verify_artifacts.outputs.installer_sha256 }}
    steps:
      - name: Validate version input
        id: validate
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${INPUT_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid version format. Expected strict MAJOR.MINOR.PATCH without 'v' prefix or extra characters."
            exit 1
          fi
          echo "version=${INPUT_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Checkout private source repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: GonzaloH12/HaxballAPP
          ref: refs/tags/v${{ steps.validate.outputs.version }}
          token: ${{ secrets.CODE_TOKEN }}
          persist-credentials: false
          clean: true

      - name: Verify source version and credential hygiene
        id: verify_source
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          if git config --local --get-all http.https://github.com/.extraheader >/dev/null 2>&1; then
            echo "::error::Git credentials must not persist in .git/config after checkout."
            exit 1
          fi
          ver=$(grep -m1 '^version' native/player/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [[ "${ver}" != "${EXPECTED_VERSION}" ]]; then
            echo "::error::native/player/Cargo.toml version (${ver}) does not match requested version (${EXPECTED_VERSION})."
            exit 1
          fi
          commit_sha=$(git rev-parse --verify HEAD)
          echo "source_commit=${commit_sha}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1 (master)
        with:
          toolchain: stable

      - name: Cache Cargo registry and build directory
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/Cargo.lock') }}

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Exact version: this node.exe goes in the training engine. A new one changes the
          # engine's hash and every player who trains downloads it again (~38 MB), so bump it on purpose.
          node-version: "22.20.0"

      - name: Install Campus production dependencies and pinned esbuild tool
        shell: bash
        working-directory: campus
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts
          npm rebuild node-datachannel --foreground-scripts
          npm install --prefix "${RUNNER_TEMP}/esbuild-tool" --no-save --ignore-scripts "esbuild@${ESBUILD_VERSION}"
          export ESBUILD_BIN="${RUNNER_TEMP}/esbuild-tool/node_modules/.bin/esbuild.cmd"
          echo "${RUNNER_TEMP}/esbuild-tool/node_modules/.bin" >> "${GITHUB_PATH}"
          npm test

      - name: Run Rust workspace tests and build release executable
        shell: bash
        working-directory: native
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=."
        run: |
          set -euo pipefail
          cargo test --locked --workspace
          cargo build --locked --release -p haxball-player

      - name: Lay out install tree and bundle Campus into dist/sala/
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          SOURCE_COMMIT: ${{ steps.verify_source.outputs.source_commit }}
        run: |
          set -euo pipefail
          python native/tools/package.py "${RELEASE_VERSION}" dist-release --no-zip
          if [[ -e "dist-release/app/campus/src" ]]; then
            echo "::error::Private Campus source folder dist-release/app/campus/src must never be present in release tree."
            exit 1
          fi

      # Code signing goes here once there is a Windows Authenticode certificate:
      # sign dist-release/app/haxball-player.exe BEFORE zipping and building the installer.

      - name: Build update ZIP and unsigned manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          SOURCE_COMMIT: ${{ steps.verify_source.outputs.source_commit }}
        run: |
          set -euo pipefail
          python native/tools/package.py "${RELEASE_VERSION}" dist-release --zip-only

      - name: Build Windows installer with Inno Setup
        shell: cmd
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          WORKSPACE_DIR: ${{ github.workspace }}
        run: |
          iscc "/DAppVersion=%RELEASE_VERSION%" "/DSourceDir=%WORKSPACE_DIR%\dist-release\app" "/DOutDir=%WORKSPACE_DIR%\dist-release" "native\installer\haxball.iss"

      - name: Verify release artifacts and record hashes
        id: verify_artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          EXPECTED_SOURCE_COMMIT: ${{ steps.verify_source.outputs.source_commit }}
        run: |
          set -euo pipefail
          rm -rf dist-release/app dist-release/training
          python native/tools/package.py "${RELEASE_VERSION}" dist-release --verify-release
          zip_sha=$(python -c "import json; m=json.load(open('dist-release/build-manifest.json')); print(m['artifacts']['zip']['sha256'])")
          inst_sha=$(python -c "import json; m=json.load(open('dist-release/build-manifest.json')); print(m['artifacts']['installer']['sha256'])")
          echo "zip_sha256=${zip_sha}" >> "${GITHUB_OUTPUT}"
          echo "installer_sha256=${inst_sha}" >> "${GITHUB_OUTPUT}"

      - name: Upload verified unsigned release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.4.0
        with:
          name: unsigned-release-${{ steps.validate.outputs.version }}
          if-no-files-found: error
          retention-days: 5
          # The whole folder: after --verify-release it holds only the zips, the
          # installer and the manifests (app/ and training/ were removed above).
          path: |
            dist-release/
            native/tools/bundle_campus.py
            native/tools/package.py
            native/tools/sign.mjs

  sign_and_publish:
    name: Sign manifest and publish GitHub Release
    needs: build
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Download unsigned release bundle
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v4.1.8
        with:
          name: unsigned-release-${{ needs.build.outputs.version }}
          path: staged

      - name: Verify downloaded artifact hashes before signing
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          EXPECTED_ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
          EXPECTED_INSTALLER_SHA256: ${{ needs.build.outputs.installer_sha256 }}
        run: |
          set -euo pipefail
          python staged/native/tools/package.py "${RELEASE_VERSION}" staged/dist-release --verify-release
          actual_zip_sha=$(python -c "import json; m=json.load(open('staged/dist-release/build-manifest.json')); print(m['artifacts']['zip']['sha256'])")
          actual_inst_sha=$(python -c "import json; m=json.load(open('staged/dist-release/build-manifest.json')); print(m['artifacts']['installer']['sha256'])")
          if [[ "${actual_zip_sha}" != "${EXPECTED_ZIP_SHA256}" || "${actual_inst_sha}" != "${EXPECTED_INSTALLER_SHA256}" ]]; then
            echo "::error::Artifact SHA-256 mismatch between build job and signing job."
            exit 1
          fi

      - name: Sign and verify update manifest and release provenance statement
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          UPDATE_SIGNING_KEY_FILE: staged/update-signing-key.enc
          UPDATE_SIGNING_KEY_ENC: ${{ secrets.UPDATE_SIGNING_KEY_ENC }}
          UPDATE_SIGNING_PASSPHRASE: ${{ secrets.UPDATE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${UPDATE_SIGNING_KEY_ENC}" ]]; then
            echo "::error::GitHub secret UPDATE_SIGNING_KEY_ENC is not configured."
            exit 1
          fi
          if [[ -z "${UPDATE_SIGNING_PASSPHRASE}" ]]; then
            echo "::error::GitHub secret UPDATE_SIGNING_PASSPHRASE is not configured."
            exit 1
          fi
          printf '%s' "${UPDATE_SIGNING_KEY_ENC}" > "${UPDATE_SIGNING_KEY_FILE}"
          unset UPDATE_SIGNING_KEY_ENC
          node staged/native/tools/sign.mjs sign staged/dist-release/manifest.json
          node staged/native/tools/sign.mjs verify staged/dist-release/manifest.json
          # The training pack's two parts (engine: node.exe + node_modules; campus: code + exercises),
          # which the app downloads only when Training is used.
          for part in engine campus; do
            node staged/native/tools/sign.mjs sign "staged/dist-release/training-${part}-manifest.json"
            node staged/native/tools/sign.mjs verify "staged/dist-release/training-${part}-manifest.json"
          done
          python staged/native/tools/package.py "${RELEASE_VERSION}" staged/dist-release --verify-release
          node staged/native/tools/sign.mjs sign-provenance staged/dist-release/build-manifest.json
          node staged/native/tools/sign.mjs verify-provenance staged/dist-release/build-manifest.json
          python staged/native/tools/package.py "${RELEASE_VERSION}" staged/dist-release --verify-release --require-signature

      - name: Enforce release immutability and publish deterministic release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          if gh release view "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release v${RELEASE_VERSION} already exists. Immutable release policy forbids overwriting published releases; increment PATCH version for hotfixes."
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${RELEASE_VERSION} already exists in ${GITHUB_REPOSITORY}. Refusing to mutate an existing release tag."
            exit 1
          fi
          zip_file="staged/dist-release/HaxNex-${RELEASE_VERSION}-win64.zip"
          exe_file="staged/dist-release/HaxNex-Setup-${RELEASE_VERSION}.exe"
          manifest_file="staged/dist-release/manifest.json"
          engine_zip_file="staged/dist-release/HaxNex-Training-Engine-${RELEASE_VERSION}-win64.zip"
          engine_manifest_file="staged/dist-release/training-engine-manifest.json"
          campus_zip_file="staged/dist-release/HaxNex-Training-Campus-${RELEASE_VERSION}.zip"
          campus_manifest_file="staged/dist-release/training-campus-manifest.json"
          build_manifest_file="staged/dist-release/build-manifest.json"
          for f in "${zip_file}" "${exe_file}" "${manifest_file}" "${engine_zip_file}" "${engine_manifest_file}" "${campus_zip_file}" "${campus_manifest_file}" "${build_manifest_file}"; do
            if [[ ! -s "${f}" ]]; then
              echo "::error::Missing or empty required release file: ${f}"
              exit 1
            fi
          done
          gh release create "v${RELEASE_VERSION}" \
            "${exe_file}" \
            "${zip_file}" \
            "${manifest_file}" \
            "${engine_zip_file}" \
            "${engine_manifest_file}" \
            "${campus_zip_file}" \
            "${campus_manifest_file}" \
            "${build_manifest_file}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "HaxNex v${RELEASE_VERSION}" \
            --notes-file - <<< "Release v${RELEASE_VERSION} (source commit \`${SOURCE_COMMIT}\`)."
